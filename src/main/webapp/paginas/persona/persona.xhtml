<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:crud="jakarta.faces.composite/crud">

    <ui:define name="titulo">Personas</ui:define>

    <ui:define name="contenido">

        <crud:crudTransaccional model="#{personaModel}"
                                lazyModel="#{personaModel.lazyModel}"
                                titulo="Personas"
                                anchoDialogo="850">

            <p:column headerText="Nombres" sortBy="#{registro.nombres}">
                <h:outputText value="#{registro.nombres}"/>
            </p:column>

            <p:column headerText="Apellidos" sortBy="#{registro.apellidos}">
                <h:outputText value="#{registro.apellidos}"/>
            </p:column>

            <p:column headerText="Fecha de Nacimiento" sortBy="#{registro.fechaNacimiento}">
                <h:outputText value="#{registro.fechaNacimiento}">
                    <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                </h:outputText>
            </p:column>

            <f:facet name="formulario">
                <h:panelGrid columns="2" cellpadding="7" columnClasses="ui-grid-col-4,ui-grid-col-8" style="width:100%">

                    <p:outputLabel value="Nombres:" for="nombres"/>
                    <p:inputText id="nombres" value="#{personaModel.registroActual.nombres}" required="true"/>

                    <p:outputLabel value="Apellidos:" for="apellidos"/>
                    <p:inputText id="apellidos" value="#{personaModel.registroActual.apellidos}" required="true"/>

                    <p:outputLabel value="Fecha de Nacimiento:" for="fechaNacimiento"/>
                    <p:datePicker id="fechaNacimiento" value="#{personaModel.registroActual.fechaNacimiento}" pattern="dd/MM/yyyy" showIcon="true"/>

                </h:panelGrid>
            </f:facet>


            <f:facet name="relaciones">

                <p:outputPanel rendered="#{personaModel.estadoCrear}">
                    <h:outputText value="Guarde la persona para poder agregar documentos, medios de contacto y roles."/>
                </p:outputPanel>

                <p:outputPanel rendered="#{personaModel.estadoModificar}">
                    <p:tabView>

                        <p:tab title="Documentos">
                            <p:outputPanel id="pnlDocumentos">
                                <p:dataTable value="#{personaModel.documentos}" var="doc"
                                             emptyMessage="La persona no tiene documentos." size="small">
                                    <p:column headerText="Tipo">
                                        <h:outputText value="#{doc.idTipoDocumento.nombre}"/>
                                    </p:column>
                                    <p:column headerText="Valor">
                                        <h:outputText value="#{doc.valor}"/>
                                    </p:column>
                                    <p:column headerText="Ruta física">
                                        <h:outputText value="#{doc.rutaFisica}"/>
                                    </p:column>
                                    <p:column headerText="Acción" width="70">
                                        <p:commandButton icon="pi pi-trash" title="Quitar documento"
                                                         styleClass="ui-button-danger"
                                                         action="#{personaModel.quitarDocumento(doc)}"
                                                         process="@this"
                                                         update="pnlDocumentos @([id$=mensajes])">
                                            <p:confirm header="Quitar documento"
                                                       message="¿Desea quitar este documento?"
                                                       icon="pi pi-exclamation-triangle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <p:panelGrid columns="2" style="width:100%; margin-top:1rem">
                                    <p:outputLabel for="docTipo" value="Tipo:"/>
                                    <p:selectOneMenu id="docTipo"
                                                     value="#{personaModel.documentoNuevo.idTipoDocumento}"
                                                     converter="#{entityConverter}" filter="true">
                                        <f:selectItem itemLabel="Seleccione un tipo..." itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{personaModel.tiposDocumento}" var="td"
                                                       itemLabel="#{td.nombre}" itemValue="#{td}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel for="docValor" value="Valor:"/>
                                    <p:inputText id="docValor" value="#{personaModel.documentoNuevo.valor}"/>

                                    <p:outputLabel for="docRuta" value="Ruta física:"/>
                                    <p:inputText id="docRuta" value="#{personaModel.documentoNuevo.rutaFisica}"/>

                                    <h:outputText value=""/>
                                    <p:commandButton value="Agregar documento" icon="pi pi-plus"
                                                     styleClass="ui-button-success"
                                                     action="#{personaModel.agregarDocumento()}"
                                                     process="@this docTipo docValor docRuta"
                                                     update="pnlDocumentos @([id$=mensajes])"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="Medios de contacto">
                            <p:outputPanel id="pnlMedios">
                                <p:dataTable value="#{personaModel.mediosContacto}" var="medio"
                                             emptyMessage="La persona no tiene medios de contacto." size="small">
                                    <p:column headerText="Tipo">
                                        <h:outputText value="#{medio.idTipoMedioContacto.nombre}"/>
                                    </p:column>
                                    <p:column headerText="Valor">
                                        <h:outputText value="#{medio.valor}"/>
                                    </p:column>
                                    <p:column headerText="Acción" width="70">
                                        <p:commandButton icon="pi pi-trash" title="Quitar medio de contacto"
                                                         styleClass="ui-button-danger"
                                                         action="#{personaModel.quitarMedioContacto(medio)}"
                                                         process="@this"
                                                         update="pnlMedios @([id$=mensajes])">
                                            <p:confirm header="Quitar medio de contacto"
                                                       message="¿Desea quitar este medio de contacto?"
                                                       icon="pi pi-exclamation-triangle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <p:panelGrid columns="2" style="width:100%; margin-top:1rem">
                                    <p:outputLabel for="medTipo" value="Tipo:"/>
                                    <p:selectOneMenu id="medTipo"
                                                     value="#{personaModel.medioNuevo.idTipoMedioContacto}"
                                                     converter="#{entityConverter}" filter="true">
                                        <f:selectItem itemLabel="Seleccione un tipo..." itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{personaModel.tiposMedioContacto}" var="tmc"
                                                       itemLabel="#{tmc.nombre}" itemValue="#{tmc}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel for="medValor" value="Valor:"/>
                                    <p:inputText id="medValor" value="#{personaModel.medioNuevo.valor}"/>

                                    <h:outputText value=""/>
                                    <p:commandButton value="Agregar medio" icon="pi pi-plus"
                                                     styleClass="ui-button-success"
                                                     action="#{personaModel.agregarMedioContacto()}"
                                                     process="@this medTipo medValor"
                                                     update="pnlMedios @([id$=mensajes])"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>

                        <p:tab title="Roles">
                            <p:outputPanel id="pnlRoles">
                                <p:dataTable value="#{personaModel.roles}" var="rol"
                                             emptyMessage="La persona no tiene roles asignados." size="small">
                                    <p:column headerText="Rol">
                                        <h:outputText value="#{rol.idRol.nombre}"/>
                                    </p:column>
                                    <p:column headerText="Clínica">
                                        <h:outputText value="#{rol.idClinica.nombre}"/>
                                    </p:column>
                                    <p:column headerText="Acción" width="70">
                                        <p:commandButton icon="pi pi-trash" title="Quitar rol"
                                                         styleClass="ui-button-danger"
                                                         action="#{personaModel.quitarRol(rol)}"
                                                         process="@this"
                                                         update="pnlRoles @([id$=mensajes])">
                                            <p:confirm header="Quitar rol"
                                                       message="¿Desea quitar este rol?"
                                                       icon="pi pi-exclamation-triangle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>

                                <p:panelGrid columns="2" style="width:100%; margin-top:1rem">
                                    <p:outputLabel for="rolSel" value="Rol:"/>
                                    <p:selectOneMenu id="rolSel" value="#{personaModel.rolNuevo.idRol}"
                                                     converter="#{entityConverter}" filter="true">
                                        <f:selectItem itemLabel="Seleccione un rol..." itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{personaModel.rolesActivos}" var="r"
                                                       itemLabel="#{r.nombre}" itemValue="#{r}"/>
                                    </p:selectOneMenu>

                                    <p:outputLabel for="rolClinica" value="Clínica:"/>
                                    <p:selectOneMenu id="rolClinica" value="#{personaModel.rolNuevo.idClinica}"
                                                     converter="#{entityConverter}" filter="true">
                                        <f:selectItem itemLabel="Ninguna" itemValue="#{null}"
                                                      noSelectionOption="true"/>
                                        <f:selectItems value="#{personaModel.clinicas}" var="c"
                                                       itemLabel="#{c.nombre}" itemValue="#{c}"/>
                                    </p:selectOneMenu>

                                    <h:outputText value=""/>
                                    <p:commandButton value="Asignar rol" icon="pi pi-plus"
                                                     styleClass="ui-button-success"
                                                     action="#{personaModel.agregarRol()}"
                                                     process="@this rolSel rolClinica"
                                                     update="pnlRoles @([id$=mensajes])"/>
                                </p:panelGrid>
                            </p:outputPanel>
                        </p:tab>

                    </p:tabView>
                </p:outputPanel>

            </f:facet>
        </crud:crudTransaccional>

    </ui:define>

</ui:composition>
