<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:crud="jakarta.faces.composite/crud">

    <ui:define name="titulo">Documentos de Persona</ui:define>

    <ui:define name="contenido">
        
        <crud:crudTransaccional model="#{documentoModel}"
                                lazyModel="#{documentoModel.lazyModel}"
                                titulo="Documentos">
                                
            <p:column headerText="Persona">
                <h:outputText value="#{registro.idPersona.nombres} #{registro.idPersona.apellidos}"/>
            </p:column>
            
            <p:column headerText="Tipo de Documento">
                <h:outputText value="#{registro.idTipoDocumento.nombre}"/>
            </p:column>
            
            <p:column headerText="Valor (Número)">
                <h:outputText value="#{registro.valor}"/>
            </p:column>
            
            <p:column headerText="Ruta Física">
                <h:outputText value="#{registro.rutaFisica}"/>
            </p:column>


            <f:facet name="formulario">
                
                <p:outputLabel value="Persona:" for="idPersona"/>
                <p:autoComplete id="idPersona" value="#{documentoModel.registroActual.idPersona}"
                                completeMethod="#{documentoModel.completePersona}"
                                var="p" itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p}"
                                converter="#{entityConverter}"
                                forceSelection="true" required="true" scrollHeight="250"
                                placeholder="Escriba un nombre para buscar..."/>
                
                <p:outputLabel value="Tipo de Documento:" for="idTipoDocumento"/>
                <p:selectOneMenu id="idTipoDocumento" value="#{documentoModel.registroActual.idTipoDocumento}"
                                 converter="#{entityConverter}" required="true" filter="true">
                    <f:selectItem itemLabel="Seleccione un tipo..." itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{tipoDocumentoModel.registros}" var="td"
                                   itemLabel="#{td.nombre}" itemValue="#{td}"/>
                </p:selectOneMenu>
                
                <p:outputLabel value="Valor del Documento:" for="valor"/>
                <p:inputText id="valor" value="#{documentoModel.registroActual.valor}" required="true"/>
                
                <p:outputLabel value="Ruta Física:" for="rutaFisica"/>
                <p:inputText id="rutaFisica" value="#{documentoModel.registroActual.rutaFisica}"/>
                
            </f:facet>
            
        </crud:crudTransaccional>
        
    </ui:define>

</ui:composition>
