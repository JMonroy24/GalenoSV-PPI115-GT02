<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:crud="jakarta.faces.composite/crud">

    <ui:define name="titulo">Documentos de Persona</ui:define>

    <ui:define name="contenido">
        
        <h:form id="frmPrincipal">
<crud:crudTransaccional model="#{documentoModel}"
                                lazyModel="#{documentoModel.lazyModel}"
                                titulo="Documentos">
                                
            <p:column headerText="Persona">
                <h:outputText value="#{registro.idPersona.nombres} #{registro.idPersona.apellidos}"/>
            </p:column>
            
            <p:column headerText="Tipo de Documento" sortBy="#{registro.idTipoDocumento.nombre}">
                <h:outputText value="#{registro.idTipoDocumento.nombre}"/>
            </p:column>
            
            <p:column headerText="Valor (Número)" sortBy="#{registro.valor}">
                <h:outputText value="#{registro.valor}"/>
            </p:column>
            
            <p:column headerText="Ruta Física" sortBy="#{registro.rutaFisica}">
                <h:outputText value="#{registro.rutaFisica}"/>
            </p:column>


            <f:facet name="formulario">
                <h:panelGrid columns="2" cellpadding="7" columnClasses="ui-grid-col-4,ui-grid-col-8" style="width:100%">
                
                <p:outputLabel value="Persona:" for="idPersona"/>
                <p:autoComplete id="idPersona" disabled="#{documentoModel.estadoModificar}" value="#{documentoModel.registroActual.idPersona}"
                                completeMethod="#{documentoModel.completePersona}"
                                var="p" itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p}"
                                converter="#{entityConverter}"
                                forceSelection="true" required="true" scrollHeight="250"
                                placeholder="Escriba un nombre para buscar..." label="Persona" requiredMessage="Complete el campo persona." minQueryLength="2"/>
                
                <p:outputLabel value="Tipo de Documento:" for="idTipoDocumento"/>
                <p:selectOneMenu id="idTipoDocumento" disabled="#{documentoModel.estadoModificar}" value="#{documentoModel.registroActual.idTipoDocumento}"
                                 converter="#{entityConverter}" required="true" filter="true" label="Tipo de Documento" requiredMessage="Complete el campo tipo de documento.">
                    <f:selectItem itemLabel="Seleccione un tipo..." itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{tipoDocumentoModel.activos}" var="td"
                                   itemLabel="#{td.nombre}" itemValue="#{td}"/>
                    <p:ajax process="@this" update="valor indicacionesTipo"/>
                </p:selectOneMenu>
                
                <p:outputLabel value="Valor del Documento:" for="valor"/>
                <h:panelGroup>
                    <p:inputText id="valor" value="#{documentoModel.registroActual.valor}" required="true" label="Valor del Documento" requiredMessage="Complete el campo valor del documento." maxlength="50" placeholder="#{documentoModel.registroActual.idTipoDocumento.indicaciones}"/>
                    <h:outputText id="indicacionesTipo" value="#{documentoModel.registroActual.idTipoDocumento.indicaciones}" styleClass="ui-text-secondary"/>
                </h:panelGroup>
                
                <p:outputLabel value="Ruta Física:" for="rutaFisica"/>
                <p:inputText id="rutaFisica" value="#{documentoModel.registroActual.rutaFisica}" label="Ruta Física" maxlength="500"/>
                
                            </h:panelGrid>
            </f:facet>
            
        </crud:crudTransaccional>
</h:form>
        
    </ui:define>

</ui:composition>
