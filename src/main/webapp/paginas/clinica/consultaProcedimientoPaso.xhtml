<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:crud="jakarta.faces.composite/crud">

    <ui:define name="titulo">Pasos de Procedimiento de Consulta</ui:define>

    <ui:define name="contenido">

        <crud:crudTransaccional model="#{consultaProcedimientoPasoModel}"
                                lazyModel="#{consultaProcedimientoPasoModel.lazyModel}"
                                titulo="Pasos de Procedimiento de Consulta">

            <p:column headerText="Procedimiento">
                <h:outputText value="#{registro.idConsultaProcedimiento.idProcedimiento.nombre}"/>
            </p:column>

            <p:column headerText="Responsable">
                <h:outputText value="#{registro.idPersonaRol.idPersona.nombres} #{registro.idPersonaRol.idPersona.apellidos}"/>
            </p:column>

            <p:column headerText="Rol">
                <h:outputText value="#{registro.idPersonaRol.idRol.nombre}"/>
            </p:column>

            <p:column headerText="Inicio" width="150">
                <h:outputText value="#{registro.fechaInicio}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Fin" width="150">
                <h:outputText value="#{registro.fechaFin}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Estado" width="120">
                <h:outputText value="#{registro.estado}"/>
            </p:column>

            <f:facet name="formulario">

                <p:outputLabel value="Procedimiento de consulta:" for="idConsultaProcedimiento"/>
                <p:autoComplete id="idConsultaProcedimiento"
                                value="#{consultaProcedimientoPasoModel.registroActual.idConsultaProcedimiento}"
                                completeMethod="#{consultaProcedimientoPasoModel.completeConsultaProcedimiento}"
                                var="cp"
                                itemLabel="#{cp.idProcedimiento.nombre} — #{cp.idConsulta.idPersonaRol.idPersona.nombres} #{cp.idConsulta.idPersonaRol.idPersona.apellidos}"
                                itemValue="#{cp}"
                                converter="#{entityConverter}"
                                forceSelection="true" required="true" requiredMessage="Seleccione un procedimiento de consulta." scrollHeight="250"
                                placeholder="Escriba procedimiento o nombre de persona..."/>

                <p:outputLabel value="Responsable (persona / rol):" for="idPersonaRol"/>
                <p:autoComplete id="idPersonaRol" value="#{consultaProcedimientoPasoModel.registroActual.idPersonaRol}"
                                completeMethod="#{consultaProcedimientoPasoModel.completePersonaRol}"
                                var="pr"
                                itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos} — #{pr.idRol.nombre}"
                                itemValue="#{pr}"
                                converter="#{entityConverter}"
                                forceSelection="true" required="true" requiredMessage="Seleccione un responsable." scrollHeight="250"
                                placeholder="Escriba nombre, apellido, rol o clínica..."/>

                <p:outputLabel value="Fecha de inicio:" for="fechaInicio"/>
                <p:datePicker id="fechaInicio" value="#{consultaProcedimientoPasoModel.registroActual.fechaInicio}"
                              showTime="true" showIcon="true" pattern="dd/MM/yyyy HH:mm"
                              required="true" requiredMessage="La fecha de inicio es obligatoria."
                              appendTo="@(body)"/>

                <p:outputLabel value="Fecha de fin:" for="fechaFin"/>
                <p:datePicker id="fechaFin" value="#{consultaProcedimientoPasoModel.registroActual.fechaFin}"
                              showTime="true" showIcon="true" pattern="dd/MM/yyyy HH:mm"
                              appendTo="@(body)"/>

                <p:outputLabel value="Estado:" for="estado"/>
                <p:inputText id="estado" value="#{consultaProcedimientoPasoModel.registroActual.estado}"
                             required="true" requiredMessage="El estado es obligatorio."
                             maxlength="20" placeholder="Máximo 20 caracteres"/>

            </f:facet>

        </crud:crudTransaccional>

    </ui:define>

</ui:composition>
