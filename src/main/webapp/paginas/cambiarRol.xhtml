<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="titulo">#{msg['page.change_role.title']}</ui:define>

    <ui:define name="contenido">
        <h:form id="frmCambiarRol">
            <p:panel header="#{msg['page.change_role.header']}" style="max-width: 600px; margin: 2rem auto;">
                <p:outputPanel styleClass="crud-fields">

                    <p:outputLabel for="selClinica" value="#{msg['page.change_role.active_clinic']}"/>
                    <p:selectOneMenu id="selClinica" value="#{sesionBean.clinicaTemp}" converter="#{entityConverter}" filter="true">
                        <f:selectItem itemLabel="#{msg['page.change_role.select_clinic']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{sesionBean.clinicasActivas}" var="clinica"
                                       itemLabel="#{clinica.nombre}" itemValue="#{clinica}"/>
                        <p:ajax event="change" update="selPersona" listener="#{sesionBean.onChangeClinicaRol}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="selRol" value="#{msg['page.change_role.role']}"/>
                    <p:autoComplete id="selRol" value="#{sesionBean.rolTemp}" converter="#{entityConverter}"
                                    completeMethod="#{rolModel.completeRol}" var="rol" itemLabel="#{rol.nombre}" itemValue="#{rol}"
                                    minQueryLength="1" queryDelay="350" scrollHeight="250" forceSelection="true" placeholder="#{msg['page.change_role.select_role']}">
                        <p:ajax event="itemSelect" update="selPersona" listener="#{sesionBean.onChangeClinicaRol}"/>
                        <p:ajax event="clear" update="selPersona" listener="#{sesionBean.onChangeClinicaRol}"/>
                    </p:autoComplete>

                    <p:outputLabel for="selPersona" value="#{msg['page.change_role.person']}"/>
                    <p:selectOneMenu id="selPersona" value="#{sesionBean.personaTemp}" converter="#{entityConverter}" filter="true">
                        <f:selectItem itemLabel="#{msg['page.change_role.select_person']}" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{sesionBean.personasDisponibles}" var="persona"
                                       itemLabel="#{persona.nombres} #{persona.apellidos}" itemValue="#{persona}"/>
                    </p:selectOneMenu>

                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="#{msg['page.change_role.btn_use_clinic']}" icon="pi pi-building" action="#{sesionBean.aplicarClinica}"
                                     process="@this selClinica" update="@form"
                                     oncomplete="if (!args.validationFailed) window.location.reload()"/>
                    <p:commandButton value="#{msg['page.change_role.btn_apply_role']}" icon="pi pi-check" action="#{sesionBean.aplicarCambios}"
                                     styleClass="ui-button-success" update="@form"
                                     oncomplete="if (!args.validationFailed) window.location.reload()"/>
                </f:facet>
            </p:panel>
        </h:form>
    </ui:define>

</ui:composition>
