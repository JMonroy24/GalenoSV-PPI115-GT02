<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">
    <ui:define name="titulo">Procedimientos</ui:define>
    <ui:define name="contenido">
        <h:form id="frmLista">
            <p:outputPanel rendered="#{procedimientoModel.estadoNinguno}">
                <p:panel header="Procedimientos">
                    <p:toolbar id="accionesProcedimiento" styleClass="crud-toolbar">
                        <p:toolbarGroup>
                            <p:commandButton value="Nuevo procedimiento" icon="pi pi-plus" styleClass="accion-nuevo"
                                             action="#{procedimientoModel.prepararNuevo()}"
                                             process="@this" update="@form :detalle" resetValues="true"/>
                            <p:commandButton value="Editar" icon="pi pi-pencil" styleClass="ui-button-warning"
                                             action="#{procedimientoModel.editarSeleccionado()}"
                                             disabled="#{empty procedimientoModel.procedimientoSeleccionado}"
                                             process="@this" update="@form :detalle" resetValues="true"/>
                            <p:commandButton value="Eliminar" icon="pi pi-trash" styleClass="ui-button-danger"
                                             action="#{procedimientoModel.eliminarSeleccionado()}"
                                             disabled="#{empty procedimientoModel.procedimientoSeleccionado}"
                                             process="@this" update="@form">
                                <p:confirm header="Eliminar procedimiento" message="¿Desea eliminar el procedimiento seleccionado?"/>
                            </p:commandButton>
                        </p:toolbarGroup>
                        <p:toolbarGroup align="right">
                            <p:outputLabel for="filtroProcedimiento" value="Buscar por nombre"/>
                            <p:inputText id="filtroProcedimiento" value="#{procedimientoModel.lazyModel.filtroGlobal}" maxlength="100"/>
                            <p:commandButton value="Buscar" icon="pi pi-search"
                                             process="@this filtroProcedimiento" update="@form">
                                <f:setPropertyActionListener value="#{null}" target="#{procedimientoModel.procedimientoSeleccionado}"/>
                            </p:commandButton>
                        </p:toolbarGroup>
                    </p:toolbar>

                    <p:dataTable id="tablaProcedimientos" value="#{procedimientoModel.lazyModel}" var="registro"
                                 lazy="true" reflow="true" paginator="true" paginatorAlwaysVisible="false" rows="15"
                                 selectionMode="single" selection="#{procedimientoModel.procedimientoSeleccionado}"
                                 rowKey="#{registro.idProcedimiento}" emptyMessage="No se encontraron procedimientos.">
                        <p:ajax event="rowSelect" process="@this" update="accionesProcedimiento"/>
                        <p:ajax event="rowUnselect" process="@this" update="accionesProcedimiento"/>
                        <p:column headerText="Nombre" sortBy="#{registro.nombre}"><h:outputText value="#{registro.nombre}"/></p:column>
                        <p:column headerText="Activo"><h:outputText value="#{registro.activo ? 'Sí' : 'No'}"/></p:column>
                        <p:column headerText="Observaciones"><h:outputText value="#{registro.observaciones}"/></p:column>
                    </p:dataTable>
                </p:panel>
            </p:outputPanel>
        </h:form>

        <p:outputPanel id="detalle">
            <p:panel rendered="#{not procedimientoModel.estadoNinguno}"
                     header="#{procedimientoModel.estadoCrear ? 'Nuevo procedimiento' : procedimientoModel.registroActual.nombre}">
                <h:form id="frmVolver" styleClass="crud-actions">
                    <p:commandButton value="Volver a procedimientos" icon="pi pi-arrow-left" styleClass="ui-button-secondary"
                                     action="#{procedimientoModel.cancelar()}"
                                     process="@this" update=":frmLista :detalle" resetValues="true"/>
                </h:form>
                <p:tabView id="pestanas" activeIndex="#{procedimientoModel.pestanaActiva}">
                    <p:ajax event="tabChange"/>
                    <p:tab title="Datos del procedimiento">
                        <h:form id="frmProcedimiento">
                            <p:outputPanel styleClass="crud-fields">
                                <p:outputLabel for="nombre" value="Nombre"/>
                                <p:inputText id="nombre" value="#{procedimientoModel.registroActual.nombre}"
                                             required="true" requiredMessage="Ingrese el nombre del procedimiento." maxlength="155"/>
                                <p:outputLabel for="observaciones" value="Observaciones"/>
                                <p:inputTextarea id="observaciones" value="#{procedimientoModel.registroActual.observaciones}"
                                                 rows="3" maxlength="2000"/>
                                <p:selectBooleanCheckbox id="activo" value="#{procedimientoModel.registroActual.activo}" itemLabel="Procedimiento activo"/>
                            </p:outputPanel>
                            <div class="crud-actions">
                                <p:commandButton value="Guardar procedimiento" icon="pi pi-check" styleClass="ui-button-success"
                                                 action="#{procedimientoModel.guardar()}"
                                                 process="@form" update=":frmLista :detalle"/>
                            </div>
                        </h:form>
                    </p:tab>
                    <p:tab title="Pasos" disabled="#{procedimientoModel.estadoCrear}">
                        <ui:include src="/resources/crud/pasosProcedimiento.xhtml"/>
                    </p:tab>
                </p:tabView>
            </p:panel>
        </p:outputPanel>

        <p:confirmDialog global="true" responsive="true">
            <p:commandButton value="Eliminar" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" icon="pi pi-trash"/>
            <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times"/>
        </p:confirmDialog>
    </ui:define>
</ui:composition>
