<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:crud="jakarta.faces.composite/crud">

    <ui:define name="titulo">#{msg['menu.roles']}</ui:define>

    <ui:define name="contenido">

        <h:form id="frmPrincipal">
<crud:crudTransaccional model="#{rolModel}" lazyModel="#{rolModel.lazyModel}"
                                titulo="#{msg['menu.roles']}">

            <p:column headerText="#{msg['label.name']}" sortBy="#{registro.nombre}">
                <h:outputText value="#{registro.nombre}"/>
            </p:column>

            <p:column headerText="#{msg['label.active']}">
                <h:outputText value="#{registro.activo eq true ? msg['val.yes'] : msg['val.no']}"/>
            </p:column>

            <p:column headerText="#{msg['lbl.observations']}" sortBy="#{registro.observaciones}">
                <h:outputText value="#{registro.observaciones}"/>
            </p:column>

            <f:facet name="formulario">
                <h:panelGrid columns="2" cellpadding="7" columnClasses="ui-grid-col-4,ui-grid-col-8" style="width:100%">

                <p:outputLabel value="#{msg['label.name']}:" for="nombre"/>
                <p:inputText id="nombre" value="#{rolModel.registroActual.nombre}" required="true" label="#{msg['label.name']}" requiredMessage="#{msg['req.name']}" maxlength="155"/>

                <p:outputLabel value="#{msg['lbl.observations']}:" for="observaciones"/>
                <p:inputTextarea id="observaciones" value="#{rolModel.registroActual.observaciones}" label="#{msg['lbl.observations']}" maxlength="2000"/>

                <p:outputLabel value="#{msg['label.active']}:" for="activo"/>
                <p:selectBooleanCheckbox id="activo" value="#{rolModel.registroActual.activo}"/>

                </h:panelGrid>
            </f:facet>

        </crud:crudTransaccional>
</h:form>

    </ui:define>

</ui:composition>
