<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="frmMenu">
        <p:menubar>
            <p:submenu label="#{msg['menu.catalogs']}" icon="pi pi-book">
                <p:menuitem value="#{msg['menu.roles']}"
                            outcome="/paginas/catalogo/rol"
                            icon="pi pi-id-card"/>
                <p:menuitem value="#{msg['menu.document_types']}"
                            outcome="/paginas/catalogo/tipoDocumento"
                            icon="pi pi-file"/>
                <p:menuitem value="#{msg['menu.contact_media_types']}"
                            outcome="/paginas/catalogo/tipoMedioContacto"
                            icon="pi pi-phone"/>
                <p:menuitem value="#{msg['menu.exam_types']}"
                            outcome="/paginas/catalogo/tipoExamen"
                            icon="pi pi-list"/>
                <p:menuitem value="#{msg['menu.exams']}"
                            outcome="/paginas/catalogo/examen"
                            icon="pi pi-search"/>
                <p:menuitem value="#{msg['menu.procedures']}"
                            outcome="/paginas/catalogo/procedimiento"
                            icon="pi pi-cog"/>
                <p:menuitem value="#{msg['menu.clinics']}"
                            outcome="/paginas/catalogo/clinica"
                            icon="pi pi-building"/>
            </p:submenu>

            <p:submenu label="#{msg['menu.persons']}" icon="pi pi-users">
                <p:menuitem value="#{msg['menu.persons']}"
                            outcome="/paginas/persona/persona"
                            icon="pi pi-user"/>
                <p:menuitem value="#{msg['menu.documents']}"
                               outcome="/paginas/persona/documento"
                               icon="pi pi-file-edit"/>

                  <p:menuitem value="#{msg['menu.contact_media']}"
                               outcome="/paginas/persona/medioContacto"
                               icon="pi pi-envelope"/>
                   <p:menuitem value="#{msg['menu.person_roles']}"
                               outcome="/paginas/persona/personaRol"
                               icon="pi pi-sitemap"/>

            </p:submenu>

            <p:submenu label="#{msg['menu.clinical_attention']}" icon="pi pi-heart">

                <p:menuitem value="#{msg['menu.consultations']}"
                            outcome="/paginas/clinica/consulta"
                            icon="pi pi-calendar"/>
                <p:menuitem value="#{msg['menu.exam_orders']}"
                            outcome="/paginas/clinica/ordenExamen"
                            icon="pi pi-clipboard"/>

                 <p:menuitem value="#{msg['menu.exam_results']}"
                             outcome="/paginas/clinica/examenResultado"
                             icon="pi pi-chart-bar"/>

            </p:submenu>
            <p:menuitem value="#{msg['menu.change_role']}" outcome="/paginas/cambiarRol" icon="pi pi-user-edit"/>
        </p:menubar>
    </h:form>

</ui:composition>
