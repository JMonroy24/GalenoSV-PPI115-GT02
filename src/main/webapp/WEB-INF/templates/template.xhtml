<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

    <f:view locale="#{localeBean.locale}" contentType="text/html">
        <h:head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>#{msg['app.name']} — <ui:insert name="titulo">#{msg['app.title']}</ui:insert></title>
            <h:outputStylesheet library="css" name="styles.css"/>
        </h:head>

        <h:body>
            <div class="layout-wrapper">

                <div class="layout-topbar" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <h:graphicImage library="images" name="galenosv-logo.png" alt="#{msg['app.name']}" styleClass="app-logo" style="height: 35px;"/>
                        <span class="app-title">#{msg['app.name']}</span>
                        <span class="app-subtitle" style="opacity: 0.8; font-weight: normal; margin-left: 0.5rem; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 0.75rem;">#{msg['app.title']}</span>
                    </div>
                    
                    <div class="app-user" style="display: flex; align-items: center; gap: 1rem;">
                        
                        <div style="display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85rem; line-height: 1.2;">
                            <h:outputText value="#{sesionBean.clinicaSeleccionada ? sesionBean.clinicaActual.nombre : msg['header.no_clinic']}" style="font-weight: 600;"/>
                            <h:outputText value="#{sesionBean.personaActual != null ? sesionBean.displayUsuario : msg['header.no_role']}" style="opacity: 0.85; font-weight: 400;"/>
                        </div>
                        
                        <p:button title="#{msg['menu.change_role']}" outcome="/paginas/cambiarRol" icon="pi pi-users" styleClass="ui-button-outlined" style="color: white; border-color: rgba(255,255,255,0.4); border-radius: 4px;"/>
                        
                        <h:form id="frmLang" style="margin: 0;">
                            <p:commandButton id="btnLang" type="button" icon="pi pi-globe" value="#{localeBean.language.toUpperCase()}" styleClass="ui-button-flat" style="color: white;"/>
                            <p:menu overlay="true" trigger="btnLang" my="left top" at="left bottom">
                                <p:menuitem value="Español" action="#{localeBean.setLanguage('es')}" ajax="false" />
                                <p:menuitem value="English" action="#{localeBean.setLanguage('en')}" ajax="false" />
                            </p:menu>
                        </h:form>
                        
                        <h:form id="frmSesion" style="margin: 0;">
                            <p:commandButton title="#{msg['template.logout']}" icon="pi pi-sign-out"
                                             action="#{sesionBean.cerrarSesion}" ajax="false"
                                             rendered="#{sesionBean.clinicaSeleccionada}"
                                             styleClass="ui-button-flat" style="color: white;"/>
                        </h:form>
                    </div>
                </div>



                <div class="layout-menu">
                    <ui:include src="/WEB-INF/templates/menu.xhtml"/>
                </div>

                <p:growl id="growlGlobal" showDetail="true" life="4000"><p:autoUpdate/></p:growl>

                <div class="layout-content">
                    <ui:insert name="contenido">

                    </ui:insert>
                </div>

                <div class="layout-footer">
                    #{msg['app.name']} v1.0 &#8212; #{msg['app.footer.text']}
                </div>

            </div>
        </h:body>
    </f:view>
</html>
