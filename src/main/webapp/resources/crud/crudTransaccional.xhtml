<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:crud="jakarta.faces.composite/crud"
      xmlns:cc="jakarta.faces.composite"
      xmlns:pt="jakarta.faces.passthrough">

    <cc:interface>
        <cc:attribute name="model"         required="true" />
        <cc:attribute name="lazyModel"     required="true" />
        <cc:attribute name="titulo"        required="true" type="java.lang.String" />
        <cc:attribute name="anchoDialogo"  default="600"   type="java.lang.Integer" />
        <cc:attribute name="tituloRelaciones" default="#{msg['lbl.relations']}" />
        <cc:attribute name="mostrarRelacionesEnCreacion" default="true" type="java.lang.Boolean" />
        <cc:facet     name="formulario" />
        <cc:facet     name="relaciones" />
        <cc:facet     name="accionesExtra" />
    </cc:interface>

    <cc:implementation>
        <p:outputPanel id="crudContainer">

        <!-- ═══ VISTA LISTA (tabla) ═══ -->
        <p:outputPanel id="frmCrud" rendered="#{cc.attrs.model.registroActual == null}">
            <p:panel header="#{cc.attrs.titulo}">
                <p:toolbar id="toolbarTop" styleClass="crud-toolbar">
                    <p:toolbarGroup>
                        <cc:renderFacet name="accionesExtra"/>
                        <crud:botonesTop model="#{cc.attrs.model}" update="crudContainer" dialog="dlgFormularioTx" />
                    </p:toolbarGroup>
                    <p:toolbarGroup align="right">
                        <p:inputText id="campoBusqueda"
                                     value="#{cc.attrs.lazyModel.filtroGlobal}"
                                     placeholder="#{msg['lbl.search']}" pt:aria-label="#{msg['btn.search']}" maxlength="100"/>
                        <p:commandButton icon="pi pi-search"
                                         title="#{msg['btn.search']}" pt:aria-label="#{msg['btn.search']}"
                                         styleClass="ui-button-info"
                                         process="campoBusqueda @this"
                                         update="tabla toolbarTop">
                            <f:setPropertyActionListener value="#{null}" target="#{cc.attrs.model.seleccion}"/>
                        </p:commandButton>
                        <p:commandButton icon="pi pi-times"
                                         title="#{msg['btn.clear']}" pt:aria-label="#{msg['btn.clear']}"
                                         styleClass="ui-button-secondary"
                                         process="@this"
                                         update="tabla toolbarTop" resetValues="true">
                            <f:setPropertyActionListener value="#{null}"
                                                         target="#{cc.attrs.lazyModel.filtroGlobal}"/>
                            <f:setPropertyActionListener value="#{null}" target="#{cc.attrs.model.seleccion}"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="tabla" var="registro"
                             value="#{cc.attrs.lazyModel}"
                             lazy="true"
                             emptyMessage="#{cc.attrs.lazyModel.esperaFiltro ? msg['msg.enter_filter'] : msg['msg.empty_records']}"
                             reflow="true"
                             rows="15"
                             paginator="true"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="10,15,25,50"
                             paginatorPosition="both"
                             stripedRows="true"
                             size="small"
                             selectionMode="single"
                             selection="#{cc.attrs.model.seleccion}"
                             rowKey="#{registro.idKey}">

                    <p:ajax event="rowSelect"   update="toolbarTop"/>
                    <p:ajax event="rowUnselect" update="toolbarTop"/>

                    <cc:insertChildren/>
                </p:dataTable>
            </p:panel>
        </p:outputPanel>

            <p:confirmDialog global="true" responsive="true">
                <p:commandButton value="#{msg['btn.yes']}" type="button"
                                 styleClass="ui-confirmdialog-yes ui-button-danger"
                                 icon="pi pi-check"/>
                <p:commandButton value="#{msg['btn.no']}" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-secondary"
                                 icon="pi pi-times"/>
            </p:confirmDialog>

        <!-- ═══ VISTA FORMULARIO (crear / editar) ═══ -->
        <p:outputPanel id="frmDialogo" rendered="#{cc.attrs.model.registroActual != null}">
            <p:panel header="#{cc.attrs.model.estadoCrear ? msg['lbl.new'] : msg['lbl.edit']} — #{cc.attrs.titulo}">
                <p:messages id="msgForm" showDetail="true" closable="true"/>

                <!-- ─── Campos principales del formulario ─── -->
                <p:outputPanel id="pnlFormulario" styleClass="crud-main-fields">
                    <cc:renderFacet name="formulario"/>
                </p:outputPanel>

                <p:divider/>

                <!-- ─── Botones Guardar / Cancelar ─── -->
                <p:toolbar styleClass="crud-toolbar">
                    <p:toolbarGroup align="right">
                        <p:commandButton id="btnGuardar"
                                         value="#{msg['btn.save']}" icon="pi pi-check"
                                         styleClass="ui-button-success"
                                         action="#{cc.attrs.model.guardar()}"
                                         process="@this :#{cc.facets.formulario.clientId}"
                                         update="crudContainer"/>
                        <p:commandButton id="btnCancelar"
                                         value="#{msg['btn.cancel']}" icon="pi pi-times"
                                         styleClass="ui-button-secondary"
                                         action="#{cc.attrs.model.cancelar()}"
                                         process="@this"
                                         update="crudContainer"
                                         resetValues="true"/>
                    </p:toolbarGroup>
                </p:toolbar>

            </p:panel>

            <p:outputPanel rendered="#{not empty cc.facets.relaciones and (cc.attrs.model.estadoModificar or cc.attrs.mostrarRelacionesEnCreacion)}"
                           styleClass="crud-secondary">
                <p:tabView id="tabRelaciones">
                    <p:tab title="#{cc.attrs.tituloRelaciones}">
                        <cc:renderFacet name="relaciones"/>
                    </p:tab>
                </p:tabView>
            </p:outputPanel>
        </p:outputPanel>

        </p:outputPanel>
    </cc:implementation>
</html>
